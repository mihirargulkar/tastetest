services:
  - type: web
    name: tastetest
    runtime: docker
    plan: free # sleeps after ~15 min idle; the first request after that takes ~30-60s to wake
    healthCheckPath: /api/demos
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LIVE_MODE
        value: "on"
      - key: LIVE_RUNS_PER_DAY
        value: "30"
      - key: BRIEFS_PER_DAY
        value: "200"
